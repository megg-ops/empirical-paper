[project]
name = "empirical-paper"
version = "0.8.0"
description = "Empirical paper writing skill for Claude Code"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "python-docx",
    "lxml",
    "pandas",
    "openpyxl",
    "matplotlib",
    "pypandoc",
    "pypdf",
    "numpy",
    "scipy",
    "statsmodels",
    "linearmodels",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
